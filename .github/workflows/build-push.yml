name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci: update image tag')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pleiades:latest
            ${{ secrets.DOCKER_USERNAME }}/pleiades:${{ github.sha }}

      - name: Update deployment image tag
        run: |
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/pleiades:.*|image: ${{ secrets.DOCKER_USERNAME }}/pleiades:${{ github.sha }}|" k8s/deployment.yml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/deployment.yml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push https://${{ secrets.GH_PAT }}@github.com/VardhanYash373/Pleiades.git main