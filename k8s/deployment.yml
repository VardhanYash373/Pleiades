apiVersion: apps/v1
kind: Deployment
metadata:
  name: pleiades
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pleiades
  template:
    metadata:
      labels:
        app: pleiades
    spec:
      containers:
        - name: pleiades
          image: vardhanyash/pleiades:b2f6b8f391a86b43026f148e036edf86a5d2c4e7
          ports:
            - containerPort: 5000