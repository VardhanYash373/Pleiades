apiVersion: apps/v1
kind: Deployment
metadata:
  name: pleiades
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pleiades
  template:
    metadata:
      labels:
        app: pleiades
    spec:
      containers:
        - name: pleiades
          image: vardhanyash/pleiades:b3f7fca7851114b8a119202e2f016d2da134a0dd
          ports:
            - containerPort: 5000