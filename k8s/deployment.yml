apiVersion: apps/v1
kind: Deployment
metadata:
  name: Pleiades
spec:
  replicas: 2
  selector:
    matchLabels:
      app: Pleiades
  template:
    metadata:
      labels:
        app: Pleiades
  spec:
    containers:
      - name: Pleiades
        image: vardhanyash/pleiades:latest
        ports:
          - containerPort: 5000
